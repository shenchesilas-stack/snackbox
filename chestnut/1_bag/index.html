<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>糖炒毛栗子</title><link rel="stylesheet" href="../../style.css"></head><body><main><div class="sub"><a href="../../">桌上</a> · 糖炒毛栗子</div><h1>糖炒毛栗子</h1><p class="sub">一纸袋，刚递到手里还在冒热气，烫得只能用指尖捏着袋边轻轻挤。栗子甜焦糖味和铁锅味先到，还没吃到，眼睛已经先被熏得眯起来了。</p>

<div class="note">盒盖内侧的便签：香气是最好的招牌。鼻子先知道栗子好不好吃、摊位在哪里。没有香味的栗子摊没有灵魂。</div>
<ul class="tray"><li><a href="chestnut.html">毛栗子</a><span class="sub"> —— 深褐色的壳，亮，热的，有的裂了口，袋里挤着（10 颗）</span></li></ul>
