<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毛栗子 · 第 9 颗</title><link rel="stylesheet" href="../../../style.css"></head><body><main><div class="sub"><a href="../../../">零食盒子</a> · <a href="../../../chestnut/1_bag/">糖炒毛栗子</a></div><h1>毛栗子 · 第 9 颗</h1>



<dl>
<dt>包装</dt><dd>最后几个是硬的，凉了，已经不想碰了。</dd>
<dt>看</dt><dd>壳不裂了，得用牙。</dd>
<dt>闻</dt><dd>袋子一开是栗子甜焦糖味，还有铁锅味。鼻子先知道好不好吃。</dd>
<dt>入口头两秒</dt><dd>硬的，凉的。</dd>
<dt>化的方式</dt><dd>嚼着费劲，甜也淡了，粉多过糯，壳渣扎牙床。</dd>
<dt>余味（大约 8 分钟散完）</dt><dd><div><span class="at">0 分钟</span>嘴里干干的一层粉。</div><div><span class="at">3 分钟</span>什么都不剩，手上还是黑的。</div></dd>
</dl>
