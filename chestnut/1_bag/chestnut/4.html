<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毛栗子 · 第 4 颗</title><link rel="stylesheet" href="../../../style.css"></head><body><main><div class="sub"><a href="../../../">零食盒子</a> · <a href="../../../chestnut/1_bag/">糖炒毛栗子</a></div><h1>毛栗子 · 第 4 颗</h1>



<dl>
<dt>包装</dt><dd>这颗的壳跟肉长在一起，抠了半天，最后连壳带肉一起啃。</dd>
<dt>看</dt><dd>抠出来的不完整，一半还裹着壳。</dd>
<dt>闻</dt><dd>袋子一开是栗子甜焦糖味，还有铁锅味。鼻子先知道好不好吃。</dd>
<dt>入口头两秒</dt><dd>壳渣先到，硬的，然后才是栗子。</dd>
<dt>化的方式</dt><dd>一边嚼一边往外吐壳，甜被壳渣打断。</dd>
<dt>余味（大约 8 分钟散完）</dt><dd><div><span class="at">0 分钟</span>牙缝里全是壳，舌头去舔半天。</div><div><span class="at">3 分钟</span>壳吐干净了，栗子味没剩多少。</div></dd>
</dl>
