<dl>
<dt>包装</dt><dd>最后几个是硬的，凉了，已经不想碰了。</dd>
<dt>看</dt><dd>剥到一半发现是坏的，黑的。</dd>
<dt>闻</dt><dd>袋子一开是栗子甜焦糖味，还有铁锅味。鼻子先知道好不好吃。</dd>
<dt>入口头两秒</dt><dd>苦。</dd>
<dt>化的方式</dt><dd>吐掉。</dd>
<dt>余味（大约 8 分钟散完）</dt><dd><div><span class="at">0 分钟</span>嘴里一点苦，下一颗小心点。</div><div><span class="at">2 分钟</span>苦走了，鼻腔里的焦糖味还在。</div></dd>
</dl>
