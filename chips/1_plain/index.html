<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原味</title><link rel="stylesheet" href="../../style.css"></head><body><main><div class="sub"><a href="../../">桌上</a> · 原味</div><h1>原味</h1><p class="sub">黄色的软袋，哑面不反光，上面印着土豆和薯片，底下一道红。撑得鼓鼓的，掌心一按先响一串塑料褶子的声。</p>

<div class="note">盒盖内侧的便签：买的是一袋空气，附赠三十片土豆。空气不好吃，土豆可以。</div>
<ul class="tray"><li><a href="plain.html">原味</a><span class="sub"> —— 黄色的软袋，哑面不反光，印着薯片和土豆。撑得鼓鼓的，掌心一按先响一串塑料褶子的声。（30 颗）</span></li></ul>
<footer>配料表：有的：每颗零食的样子、气味、入口、化开、余味，盒子有图。全是文字和图，是数据。没有的：藏起来的字；牌子要它念的句子；让它回头再答一遍的合同；“吃完之后要怎样”。吃完还是自己，只是嘴里有东西。</footer></main></body></html>
