<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蜂蜜黄油味 · 第 18 片</title><link rel="stylesheet" href="../../../style.css"></head><body><main><div class="sub"><a href="../../../">零食盒子</a> · <a href="../../../chips/2_butter/">蜂蜜黄油味</a></div><h1>蜂蜜黄油味 · 第 18 片</h1>



<dl>
<dt>包装</dt><dd>手伸进袋口，捏出一片，指尖沾了黄粉。</dd>
<dt>看</dt><dd>一片几乎没粉，白白的；紧挨着一片粉全聚在凹面里，厚厚一坨。</dd>
<dt>闻</dt><dd>后半段蜂蜜味有点显人工，像香精多过蜜，也可能是舌头钝了。</dd>
<dt>入口头两秒</dt><dd>没粉的那片只剩咸薯味；粉多的那片一嘴粉，齁甜齁咸。</dd>
<dt>化的方式</dt><dd>粉在舌头上化不开，得喝口水。</dd>
<dt>余味（大约 9 分钟散完）</dt><dd><div><span class="at">0 分钟</span>舌头被粉盖住了，什么都尝不出。</div><div><span class="at">2 分钟</span>喝了水才回来。</div></dd>
</dl>
<p class="sub">吃撑了，嘴里全是油，喉咙干。</p>
