<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蜂蜜黄油味 · 第 28–30 片</title><link rel="stylesheet" href="../../../style.css"></head><body><main><div class="sub"><a href="../../../">零食盒子</a> · <a href="../../../chips/2_butter/">蜂蜜黄油味</a></div><h1>蜂蜜黄油味 · 第 28–30 片</h1>



<dl>
<dt>包装</dt><dd>手指黄了，袋口也黄了。袋底一层肉眼看得见的浅色粉末。把袋角朝嘴边抬起，碎片和粉一起滑下来，塑料擦响，粉漏到下唇上。</dd>
<dt>看</dt><dd>覆着调味末的小碎角居多。</dd>
<dt>闻</dt><dd>后半段蜂蜜味有点显人工，像香精多过蜜，也可能是舌头钝了。</dd>
<dt>入口头两秒</dt><dd>粉的比例高，黄油、盐和甜突然变浓，舌面发粉。</dd>
<dt>化的方式</dt><dd>粉在舌头上化不开，喉咙发干。</dd>
<dt>余味（大约 9 分钟散完）</dt><dd><div><span class="at">0 分钟</span>嘴里又甜又油，想喝水，想吃咸的。</div><div><span class="at">3 分钟</span>腻留在舌根。</div><div><span class="at">8 分钟</span>手指上的黄粉洗过了，指甲缝里还有。</div></dd>
</dl>
<p class="sub">吃撑了，嘴里全是油，喉咙干。</p>
