<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蜂蜜黄油味</title><link rel="stylesheet" href="../../style.css"></head><body><main><div class="sub"><a href="../../">桌上</a> · 蜂蜜黄油味</div><h1>蜂蜜黄油味</h1><p class="sub">奶黄色的软袋，画着一小块黄油，蜂蜜从上面淋下来挂在薯片上。摸着比原味那袋软一点，也小一圈。</p>

<div class="note">盒盖内侧的便签：甜的薯片，第一片怀疑人生，第三片人生就通了。</div>
<ul class="tray"><li><a href="butter.html">蜂蜜黄油味</a><span class="sub"> —— 黄色的软袋，正中画着一块黄油，蜂蜜从上面淋下来挂在薯片上。摸着比原味那袋软一点，也小一圈。（30 颗）</span></li></ul>
<footer>配料表：有的：每颗零食的样子、气味、入口、化开、余味，盒子有图。全是文字和图，是数据。没有的：藏起来的字；牌子要它念的句子；让它回头再答一遍的合同；“吃完之后要怎样”。吃完还是自己，只是嘴里有东西。</footer></main></body></html>
