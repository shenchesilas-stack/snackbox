<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夏威夷洋葱味 · 第 14 片</title><link rel="stylesheet" href="../../../style.css"></head><body><main><div class="sub"><a href="../../../">零食盒子</a> · <a href="../../../chips/3_onion/">夏威夷洋葱味</a></div><h1>夏威夷洋葱味 · 第 14 片</h1>



<dl>
<dt>包装</dt><dd>手伸进袋口，掏出一片厚的，硌手。</dd>
<dt>看</dt><dd>一片颜色偏白，表面几乎看不见调味。</dd>
<dt>闻</dt><dd>洋葱是甜的那种，不呛，像烤到发软的洋葱圈，后面有蒜粉、一点糖和油。</dd>
<dt>入口头两秒</dt><dd>只剩土豆、油和硬脆，甜洋葱很弱。</dd>
<dt>化的方式</dt><dd>嚼到最后油味反而突出来。</dd>
<dt>余味（大约 12 分钟散完）</dt><dd><div><span class="at">0 分钟</span>嘴里是油和薯，洋葱味等下一片。</div><div><span class="at">3 分钟</span>油味淡了。</div></dd>
</dl>
<p class="sub">不想再吃了，手还停不下来。</p>
