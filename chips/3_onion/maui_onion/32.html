<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夏威夷洋葱味 · 第 32–33 片</title><link rel="stylesheet" href="../../../style.css"></head><body><main><div class="sub"><a href="../../../">零食盒子</a> · <a href="../../../chips/3_onion/">夏威夷洋葱味</a></div><h1>夏威夷洋葱味 · 第 32–33 片</h1>



<dl>
<dt>包装</dt><dd>手伸进袋口，掏出一片厚的，硌手。</dd>
<dt>看</dt><dd>一片卷得过紧，厚边特别硬，局部深褐。</dd>
<dt>闻</dt><dd>深褐处一点焦油和苦薯皮的气。</dd>
<dt>入口头两秒</dt><dd>比别的更难咬断，尖角直接顶上颚。</dd>
<dt>化的方式</dt><dd>硬得像木片，嚼半天，苦留在舌根。</dd>
<dt>余味（大约 12 分钟散完）</dt><dd><div><span class="at">0 分钟</span>焦苦在舌根。</div><div><span class="at">3 分钟</span>苦淡了，洋葱回来了。</div></dd>
</dl>
<p class="sub">吃撑了，嘴里全是油，喉咙干。</p>
